plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

apply from: rootProject.file('repositories.gradle')

// Which recipe viewer the dev client loads. runClient = JEI; :fabric:runClientRei / :fabric:runClientEmi swap it (the
// three can't coexist — EMI hides itself when JEI is present, REI + JEI double up). Mirrors the NeoForge module's toggle.
def selectedViewer = {
    def requested = gradle.startParameter.taskNames
    if (requested.any { it.endsWith('runClientRei') }) return 'rei'
    if (requested.any { it.endsWith('runClientEmi') }) return 'emi'
    return (findProperty('viewer') ?: 'jei').toString().toLowerCase()
}()

['Rei': 'REI', 'Emi': 'EMI'].each { suffix, label ->
    tasks.register("runClient${suffix}") {
        dependsOn 'runClient'
        group = 'fabric'
        description = "Runs the Fabric client with ${label} as the recipe viewer instead of JEI."
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "net.blay09.mods:balm-fabric:${balm_version}"
    // Refined Storage 2 (Fabric) — a fat mod jar that bundles the whole api/common tree plus RefinedStorageFabricApi.
    // modmenu is an optional transitive of RS we don't need; excluded to keep the dev classpath lean.
    modImplementation("com.refinedmods.refinedstorage:refinedstorage-fabric:${rs_version}") {
        exclude group: 'com.terraformersmc', module: 'modmenu'
    }
    modImplementation "maven.modrinth:cooking-for-blockheads:${cfb_fabric_version}"

    // jsr305 (javax.annotation.Nullable) — the common code uses it; it arrives transitively on NeoForge but not here.
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Optional integrations — the compat/ plugin classes live in :common, so the Fabric compile needs their APIs on
    // the classpath. Discovered at runtime via the fabric.mod.json entrypoints (JEI/REI/Jade) or annotation (EMI).
    // JEI's common-api is a plain (non-mod) library; the others are mod jars (modCompileOnly).
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}") { exclude group: 'mezz.jei' }
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modCompileOnly "maven.modrinth:jade:${jade_fabric_version}"

    // Dev-run only (not shipped): loaded in the dev client so the guide book + integrations can be tested. Patchouli
    // powers the guide book (its recipe is unconditional, so without it the guide_book recipe just fails to load — the
    // same on both loaders). One viewer (JEI) exercises the info pages; Jade the HUD. RS + CFB are already present as
    // modImplementation deps, so the network bridge itself is testable without anything else here.
    modRuntimeOnly "vazkii.patchouli:Patchouli:${patchouli_fabric_version}"
    modRuntimeOnly "maven.modrinth:jade:${jade_fabric_version}"
    // Exactly one viewer's full runtime jar is loaded, per selectedViewer above (runClient=JEI, runClientRei,
    // runClientEmi, or -Pviewer=jei|rei|emi). REI needs the full jar and its Fabric build can drag JEI via its
    // JEI-compat, so JEI is excluded from it (as on NeoForge); EMI needs the full jar, not the :api classifier.
    switch (selectedViewer) {
        case 'rei':
            modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}") { exclude group: 'mezz.jei' }
            break
        case 'emi':
            // From Modrinth, not TerraformersMC: the latter hosts only EMI's :api classifier, not the full Fabric jar.
            modRuntimeOnly "maven.modrinth:emi:${emi_fabric_modrinth}"
            break
        default:
            modRuntimeOnly "mezz.jei:jei-1.21.1-fabric:${jei_version}"
    }
    // Croptopia — for testing whether a fluid (water) in the RS grid can be used as a cooking-table ingredient.
    // EpheroLib is Croptopia's required Fabric library (hard dep).
    modRuntimeOnly "curse.maven:croptopia-415438:${croptopia_fabric_file}"
    modRuntimeOnly "curse.maven:epherolib-885449:${epherolib_fabric_file}"
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

// --- Publishing to Modrinth + CurseForge (Fabric) -------------------------------------------
// Run manually: ./gradlew :fabric:modrinth  /  :fabric:publishCurseForge . Tokens from GRADLE_USER_HOME or env.
// Publishes a separate version per loader (…+fabric-1.21.1), the same way the NeoForge module does (…+neoforge-1.21.1).
def changelogFor(File file, String version) {
    if (!file.exists()) {
        return 'See the project page for the changelog.'
    }
    def wanted = ~('^##\\s+' + java.util.regex.Pattern.quote(version) + '\\s*$')
    def collected = []
    def inSection = false
    for (String line : file.readLines('UTF-8')) {
        if (line.startsWith('## ')) {
            if (inSection) {
                break
            }
            inSection = wanted.matcher(line.trim()).matches()
            continue
        }
        if (inSection) {
            collected << line
        }
    }
    def text = collected.join('\n').trim()
    return text ?: 'See the project page for the changelog.'
}

def changelogText = changelogFor(rootProject.file('CHANGELOG.md'), mod_version.toString())

tasks.register('printChangelog') {
    group = 'publishing'
    description = 'Prints the changelog section that would be published for the current version.'
    doLast {
        println "--- changelog to publish for ${mod_version} ---"
        println changelogText
        println '--- end ---'
    }
}

modrinth {
    token = providers.gradleProperty('MODRINTH_TOKEN').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
    projectId = modrinth_id
    versionNumber = mod_version + "+fabric-" + minecraft_version
    versionName = mod_version + " (Fabric " + minecraft_version + ")"
    versionType = 'release'
    // Loom's remapped jar is the shippable one (not the raw 'jar').
    uploadFile = tasks.named('remapJar')
    gameVersions = ['1.21.1']
    loaders = ['fabric']
    changelog = changelogText
    dependencies {
        required.project 'fabric-api'
        required.project 'refined-storage'
        required.project 'cooking-for-blockheads'
        required.project 'balm'
        optional.project 'patchouli'
        optional.project 'jade'
        optional.project 'jei'
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads the built Fabric jar to CurseForge.'
    apiToken = findProperty('CURSEFORGE_TOKEN') ?: System.getenv('CURSEFORGE_TOKEN')

    def mainFile = upload(curseforge_id, tasks.named('remapJar'))
    mainFile.releaseType = 'release'
    mainFile.addGameVersion '1.21.1'
    mainFile.addModLoader 'Fabric'
    mainFile.addEnvironment 'Client', 'Server'
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogText
    mainFile.addRequirement 'fabric-api', 'refined-storage', 'cooking-for-blockheads', 'balm'
    mainFile.addOptional 'patchouli', 'jade', 'jei'
}
