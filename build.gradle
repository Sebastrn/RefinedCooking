// Root project: declares the plugins used by the modules (applied per-module, not here) and a little shared config.
// The multi-loader layout lives in common/ + neoforge/ (+ fabric/ when include_fabric=true). Loom is added to this
// block in step 4 alongside the fabric module so the NeoForge build never pulls the Fabric toolchain.
plugins {
    id 'fabric-loom' version '1.7.4' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'com.modrinth.minotaur' version '2.9.0' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.28' apply false
}

subprojects {
    configurations.all {
        resolutionStrategy {
            cacheChangingModulesFor 60, 'seconds'
            cacheDynamicVersionsFor 60, 'seconds'
        }
    }
}
