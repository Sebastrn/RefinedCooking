// Root project: declares the plugins the modules apply (applied per-module, not here) plus a little shared config.
// The multi-loader layout lives in common/ + neoforge/ (+ fabric/ when include_fabric=true). The fabric-loom plugin
// is added to this block alongside the fabric module (step: add Fabric), so the NeoForge build never pulls the Fabric
// toolchain / the loom snapshot marker.
plugins {
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'com.modrinth.minotaur' version '2.9.0' apply false
    // CurseForgeGradle off the old 1.1.28 pin: that was a Java-17/21 workaround (1.2.30+ need a Java 25 JVM to
    // resolve), and the 26.1.2 toolchain IS Java 25. See MIGRATION_NOTES §0.12.3.
    id 'net.darkhax.curseforgegradle' version '1.3.33' apply false
}

subprojects {
    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 60, 'seconds'
            cacheDynamicVersionsFor 60, 'seconds'
        }
    }
}
