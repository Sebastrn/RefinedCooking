plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.modrinth.minotaur' version '2.9.0'
    // CurseForgeGradle off the old 1.1.28 pin: that was a Java-17/21 workaround (1.2.30+ need a Java 25 JVM to
    // resolve), and the 26.1.2 toolchain IS Java 25. The publish block below configures cleanly against 1.3.33
    // (verified: addEnvironment/addModLoader/addGameVersion/addRequirement/addOptional all resolve).
    id 'net.darkhax.curseforgegradle' version '1.3.33'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'CreeperHost (Refined Storage 2)'
        url = 'https://maven.creeperhost.net/release'
    }
    maven {
        name = 'TwelveIterations (Balm)'
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
    }
    // The One Probe has no 26.1 build yet, so its integration (and this maven) is commented out for 26.1.2.
    // maven {
    //     name = 'k-4u (The One Probe)'
    //     url = 'https://maven.k-4u.nl'
    // }
    maven {
        name = 'Modrinth (Jade, Patchouli, dev test mods)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'FTB (dev test mods)'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'Architectury (transitive dep of FTB Library)'
        url = 'https://maven.architectury.dev/'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // 26.1's NeoForge split the single 'data' run type into clientData/serverData; data() no longer exists, which
        // fails IDE Gradle sync (sync configures every run). We ship no datagen providers, so one clientData run is
        // enough to keep the run valid. Matches AE2's own 26.1.2 setup.
        data {
            clientData()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Refined Storage 2, from RefinedMods' own CreeperHost maven. RS v1 has no 1.21 branch, so this is a
    // different mod internally — see MIGRATION_NOTES §0.13.
    //
    // -neoforge is the mod itself and its POM declares nothing but jsr305, so the modules we compile against
    // are named here. -common and -network then bring the whole -api tree (core/resource/storage/network/
    // common) transitively, so those need no line of their own.
    //
    // The -api modules are annotated @API(STABLE) and are preferred wherever they suffice. -common and -network
    // are implementation modules with no such guarantee, but there is no alternative: RS2's menu/screen layer
    // lives entirely in -common (128 menu/screen classes there against 1 in -common-api) and the Kitchen Access
    // Point needs a GUI. RS2's own Network Transmitter — a node with a card slot and a screen, which is exactly
    // our Access Point — is built the same way, so we follow it rather than invent a parallel structure.
    implementation "com.refinedmods.refinedstorage:refinedstorage-neoforge:${rs_version}"
    implementation "com.refinedmods.refinedstorage:refinedstorage-common:${rs_version}"
    implementation "com.refinedmods.refinedstorage:refinedstorage-network:${rs_version}"

    implementation "net.blay09.mods:balm-neoforge:${balm_version}"
    // CFB now publishes a clean 26.x build to the TwelveIterations maven, so the 1.21.1 Modrinth-id pin is gone.
    implementation "net.blay09.mods:cookingforblockheads-neoforge:${cfb_version}"

    // Optional integrations — compiled against (the compat/ classes reference them) and loaded in the dev
    // client so they can be tested. The mod still runs without them: the Jade @WailaPlugin / JEI @JeiPlugin classes
    // are only loaded by each mod's own scan when that mod is present.
    // The One Probe is COMMENTED OUT for 26.1.2 — no 26.1 build (k-4u maven ends at 1.21_neo). The addon in
    // compat/theoneprobe is likewise disabled. Re-enable both when McJty ships a 26.1 TOP.
    // implementation "mcjty.theoneprobe:theoneprobe:${top_version}"
    implementation "maven.modrinth:jade:${jade_version}"
    implementation "mezz.jei:jei-26.1.2-neoforge:${jei_version}"

    // Patchouli — optional, powers the in-game guide book. Resources only (no code dependency), so it is only needed
    // at runtime. BlameJared has no 26.1 build, so it comes from the Modrinth maven (pinned by version id).
    runtimeOnly "maven.modrinth:patchouli:${patchouli_version}"

    // Dev-only test mods — loaded in the dev client to make debugging easier. Not shipped.
    // ⚠️ ALL COMMENTED OUT for 26.1.2: the version ids above are still 1.21.1 builds and several may not be ported
    // yet — an unresolved test mod would block runClient/runServer. Re-pin each to a 26.1.2 build and un-comment when
    // a run needs it. None is shipped or on the compile classpath, so this does not affect compileJava.
    // runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    //
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-core:${harvestcraft_foodcore_version}"
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-crops:${harvestcraft_crops_version}"
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-trees:${harvestcraft_trees_version}"
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-extended:${harvestcraft_foodextended_version}"
    //
    // runtimeOnly "maven.modrinth:mekanism:${mekanism_version}"
    // runtimeOnly "maven.modrinth:mekanism-generators:${mekanism_generators_version}"
    // runtimeOnly "maven.modrinth:mekanism-tools:${mekanism_tools_version}"
    // runtimeOnly "maven.modrinth:mekanism-additions:${mekanism_additions_version}"
    //
    // clientAdditionalRuntimeClasspath "maven.modrinth:solar-flux-reborn:${solarflux_version}"
    // clientAdditionalRuntimeClasspath "maven.modrinth:hammer-lib:${hammerlib_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- Publishing to Modrinth + CurseForge ------------------------------------------------------
// Run manually (e.g. from IntelliJ's Gradle tool window, or the CLI):
//   ./gradlew modrinth            -> Modrinth
//   ./gradlew publishCurseForge   -> CurseForge
//   ./gradlew modrinth publishCurseForge   -> both
// Tokens are read from GRADLE_USER_HOME/gradle.properties (MODRINTH_TOKEN / CURSEFORGE_TOKEN) or the
// matching environment variables — NEVER commit them. Project ids live in gradle.properties.
// Tip: `modrinth { debugMode = true }` (or `--stacktrace`) to dry-run Modrinth without uploading.

// Publish only the section for the version being released. Modrinth and CurseForge render a changelog per file, so
// uploading the whole CHANGELOG.md would repeat every past release on every version's page and grow forever. The full
// history stays in CHANGELOG.md in the repo. Preview what will be sent with: ./gradlew printChangelog
def changelogFor(File file, String version) {
    if (!file.exists()) {
        return 'See the project page for the changelog.'
    }
    def wanted = ~('^##\\s+' + java.util.regex.Pattern.quote(version) + '\\s*$')
    def collected = []
    def inSection = false
    for (String line : file.readLines('UTF-8')) {
        if (line.startsWith('## ')) {
            if (inSection) {
                break // reached the next version — stop
            }
            inSection = wanted.matcher(line.trim()).matches()
            continue // never include the heading itself; the platform already shows the version
        }
        if (inSection) {
            collected << line
        }
    }
    def text = collected.join('\n').trim()
    return text ?: 'See the project page for the changelog.'
}

def changelogText = changelogFor(rootProject.file('CHANGELOG.md'), mod_version.toString())

tasks.register('printChangelog') {
    group = 'publishing'
    description = 'Prints the changelog section that would be published for the current version.'
    doLast {
        println "--- changelog to publish for ${mod_version} ---"
        println changelogText
        println '--- end ---'
    }
}

modrinth {
    token = providers.gradleProperty('MODRINTH_TOKEN').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
    projectId = modrinth_id
    versionNumber = mod_version
    versionName = mod_version
    versionType = 'release'
    uploadFile = tasks.named('jar')
    gameVersions = ['26.1.2']
    loaders = ['neoforge']
    changelog = changelogText
    // Modrinth project slugs (adjust if a publish fails on an unknown project):
    dependencies {
        required.project 'refined-storage'
        required.project 'cooking-for-blockheads'
        required.project 'balm'
        optional.project 'patchouli'
        optional.project 'jade'
        // optional.project 'the-one-probe'  // no 26.1 build yet — re-add when TOP ships for 26.1
        optional.project 'jei'
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads the built jar to CurseForge.'
    apiToken = findProperty('CURSEFORGE_TOKEN') ?: System.getenv('CURSEFORGE_TOKEN')

    def mainFile = upload(curseforge_id, tasks.named('jar'))
    // displayName left unset on purpose -> CurseForge shows the jar's file name (refinedcooking-<version>.jar).
    mainFile.releaseType = 'release'
    mainFile.addGameVersion '26.1.2'
    mainFile.addModLoader 'NeoForge'
    mainFile.addEnvironment 'Client', 'Server'
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogText
    // CurseForge project slugs (adjust if a publish fails on an unknown project):
    mainFile.addRequirement 'refined-storage', 'cooking-for-blockheads', 'balm'
    // 'the-one-probe' dropped for 26.1.2 (no 26.1 build yet) — re-add when TOP ships for 26.1.
    mainFile.addOptional 'patchouli', 'jade', 'jei'
}
