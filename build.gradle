plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.modrinth.minotaur' version '2.9.0'
    // CurseForgeGradle stays on 1.1.28: every release from 1.2.30 up needs a Java 25 JVM to even resolve, and
    // this toolchain is Java 21. Moving to 1.21.1 freed Minotaur (2.8.10 -> 2.9.0) but not this one. 1.1.28 has
    // everything the publish block uses — addEnvironment/addModLoader/addGameVersion/addRequirement/addOptional.
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations.configureEach {
    resolutionStrategy {
        // REI bundles a JEI-compat module that transitively *strictly*-pins an older JEI (19.25.0.325). ModDevGradle's
        // consistent resolution would spread that pin across every configuration (compile + all run classpaths) and
        // collide with our JEI (jei_version). We run REI JEI-free and don't want its compat, so REI's JEI dependency is
        // excluded (below) and our JEI version is forced here — a consumer force overrides a transitive strict pin.
        force "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'CreeperHost (Refined Storage 2)'
        url = 'https://maven.creeperhost.net/release'
    }
    maven {
        name = 'TwelveIterations (Balm)'
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
    }
    maven {
        name = 'k-4u (The One Probe)'
        url = 'https://maven.k-4u.nl'
    }
    maven {
        name = 'Modrinth (Cooking for Blockheads, Jade, dev test mods)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared (Patchouli, JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'shedaniel (Roughly Enough Items)'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC (EMI)'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'FTB (dev test mods)'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'Architectury (transitive dep of FTB Library)'
        url = 'https://maven.architectury.dev/'
    }
}

neoForge {
    version = project.neo_version

    runs {
        // Single client run; which recipe viewer it loads is chosen with -Pviewer (see dependencies). They can't
        // coexist, and ModDevGradle's extra client runs don't isolate their mod set, so we toggle the one run instead.
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Which recipe viewer runClient loads. Chosen by the dedicated task you invoke (runClientRei / runClientEmi) or
// -Pviewer=jei|rei|emi; defaults to jei. Resolved here at configuration time because it drives which viewer jar is
// added to the runtime classpath below.
def selectedViewer = {
    def requested = gradle.startParameter.taskNames
    if (requested.any { it.endsWith('runClientRei') }) return 'rei'
    if (requested.any { it.endsWith('runClientEmi') }) return 'emi'
    return (findProperty('viewer') ?: 'jei').toString().toLowerCase()
}()

// runClientRei / runClientEmi: the client run with that viewer instead of JEI. They just drive runClient — the viewer
// selection above keys off the task name. runClient on its own stays JEI.
['Rei': 'REI', 'Emi': 'EMI'].each { suffix, label ->
    tasks.register("runClient${suffix}") {
        dependsOn 'runClient'
        group = 'mod development'
        description = "Runs the game client with ${label} as the recipe viewer instead of JEI."
    }
}

dependencies {
    // Refined Storage 2, from RefinedMods' own CreeperHost maven. RS v1 has no 1.21 branch, so this is a
    // different mod internally — see MIGRATION_NOTES §0.13.
    //
    // -neoforge is the mod itself and its POM declares nothing but jsr305, so the modules we compile against
    // are named here. -common and -network then bring the whole -api tree (core/resource/storage/network/
    // common) transitively, so those need no line of their own.
    //
    // The -api modules are annotated @API(STABLE) and are preferred wherever they suffice. -common and -network
    // are implementation modules with no such guarantee, but there is no alternative: RS2's menu/screen layer
    // lives entirely in -common (128 menu/screen classes there against 1 in -common-api) and the Kitchen Access
    // Point needs a GUI. RS2's own Network Transmitter — a node with a card slot and a screen, which is exactly
    // our Access Point — is built the same way, so we follow it rather than invent a parallel structure.
    implementation "com.refinedmods.refinedstorage:refinedstorage-neoforge:${rs_version}"
    implementation "com.refinedmods.refinedstorage:refinedstorage-common:${rs_version}"
    implementation "com.refinedmods.refinedstorage:refinedstorage-network:${rs_version}"

    implementation "net.blay09.mods:balm-neoforge:${balm_version}"
    // CFB by Modrinth version id — the TwelveIterations maven stops at 21.1.9+1.21.1 (see gradle.properties).
    implementation "maven.modrinth:cooking-for-blockheads:${cfb_version}"

    // Optional integrations — compiled against (the compat/ classes reference them) and loaded in the dev
    // client so they can be tested. The mod still runs without them: the TOP addon is guarded by
    // Balm.isModLoaded, and the Jade @WailaPlugin class is only loaded by Jade's own scan.
    // The One Probe transitively depends on JEI (for its own optional JEI integration). That would put JEI on the
    // runtime classpath of EVERY run, so it loads no matter which viewer we pick and makes EMI/REI defer to it.
    // We don't use TOP's JEI integration, so exclude it — the viewer chosen below is then the only one present.
    implementation("mcjty.theoneprobe:theoneprobe:${top_version}") { exclude group: 'mezz.jei' }
    implementation "maven.modrinth:jade:${jade_version}"

    // Recipe viewers — JEI, REI, EMI — each carries the same item info pages (compat/{jei,rei,emi}). Compile-only:
    // every viewer discovers its plugin by its own classpath scan (@JeiPlugin / @REIPluginClient / @EmiEntrypoint),
    // so none is bundled. The three cannot share one client (EMI hides itself when JEI is present; REI+JEI double up),
    // so their runtime jars are loaded per dedicated client run — runClient=JEI, runClientRei, runClientEmi — via the
    // matching AdditionalRuntimeClasspath configurations below, not on the shared classpath.
    //
    // REI needs the full jar, not -api: the info-page entry point (BuiltinClientPlugin) lives in REI's default-plugin
    // module, absent from -api. EMI's -api classifier carries EmiInfoRecipe, so it suffices.
    //
    // REI bundles a JEI-compat module that *strictly* pins JEI (19.25.0.325). MDG's consistent resolution would
    // propagate that pin from the compile classpath into every run's runtime and collide with our JEI (19.39.0.368),
    // failing even the base client run. We don't want REI's JEI-compat anyway (REI runs JEI-free here and ships its own
    // native plugin), so JEI is excluded from REI — that drops the strict constraint. None of the REI classes we
    // compile against are JEI-compat, so nothing we use is lost.
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { exclude group: 'mezz.jei' }
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"

    // Exactly one viewer's full runtime jar is loaded, per selectedViewer above:
    //   ./gradlew runClient       (JEI, the previous behaviour)   ./gradlew runClientRei / runClientEmi
    //   ./gradlew runClient -Pviewer=rei|emi   (equivalent, if you prefer the flag)
    // runtimeOnly (not clientAdditionalRuntimeClasspath): MDG's per-run additional classpath does not reliably load
    // its mods here, whereas runtimeClasspath mods always do. JEI/REI/EMI are client-side and no-op on a dedicated
    // server, so being on the shared runtime classpath is harmless. They're compileOnly above too (for the plugins),
    // so only the selected one is ever actually loaded.
    switch (selectedViewer) {
        case 'rei':
            runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { exclude group: 'mezz.jei' }
            break
        case 'emi':
            runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
            break
        default:
            runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }

    // Patchouli — optional, powers the in-game guide book. Resources only (no code dependency), so it is
    // only needed at runtime; pulled into the dev client here.
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Dev-only test mods — loaded in the dev client to make debugging easier. Not shipped.
    // FTB Library pulls Architectury transitively via its POM.
    runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"

    // Pam's HarvestCraft 2 — piles of extra food recipes to exercise the kitchen. Food Core is the base;
    // Crops/Trees/Food Extended build on it. (Croptopia has no NeoForge 1.20.4 build, so it's omitted.)
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-core:${harvestcraft_foodcore_version}"
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-crops:${harvestcraft_crops_version}"
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-trees:${harvestcraft_trees_version}"
    runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-extended:${harvestcraft_foodextended_version}"

    // Power-generation / tech test mods — a network power source to exercise the Kitchen Station on a
    // powered Refined Storage network (e.g. Mekanism Generators / SolarFlux panels feeding the RS Controller
    // via Forge Energy). The Mekanism suite is base + generators + tools + additions (each module needs the base).
    runtimeOnly "maven.modrinth:mekanism:${mekanism_version}"
    runtimeOnly "maven.modrinth:mekanism-generators:${mekanism_generators_version}"
    runtimeOnly "maven.modrinth:mekanism-tools:${mekanism_tools_version}"
    runtimeOnly "maven.modrinth:mekanism-additions:${mekanism_additions_version}"

    // SolarFlux Reborn (+ HammerLib, its required dep — the Modrinth maven doesn't pull it transitively) are scoped
    // to the CLIENT run only. HammerLib aborts a dedicated server on startup with
    //   IllegalArgumentException: class org.zeith.hammerlib.proxy.HLCommonProxy has no @SubscribeEvent methods,
    //   but register was called anyway
    // which broke `runServer` entirely. MDG gives each run its own classpath, so the client still gets solar panels
    // while the server stays loadable; Mekanism Generators covers power testing on both.
    clientAdditionalRuntimeClasspath "maven.modrinth:solar-flux-reborn:${solarflux_version}"
    clientAdditionalRuntimeClasspath "maven.modrinth:hammer-lib:${hammerlib_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- Publishing to Modrinth + CurseForge ------------------------------------------------------
// Run manually (e.g. from IntelliJ's Gradle tool window, or the CLI):
//   ./gradlew modrinth            -> Modrinth
//   ./gradlew publishCurseForge   -> CurseForge
//   ./gradlew modrinth publishCurseForge   -> both
// Tokens are read from GRADLE_USER_HOME/gradle.properties (MODRINTH_TOKEN / CURSEFORGE_TOKEN) or the
// matching environment variables — NEVER commit them. Project ids live in gradle.properties.
// Tip: `modrinth { debugMode = true }` (or `--stacktrace`) to dry-run Modrinth without uploading.

// Publish only the section for the version being released. Modrinth and CurseForge render a changelog per file, so
// uploading the whole CHANGELOG.md would repeat every past release on every version's page and grow forever. The full
// history stays in CHANGELOG.md in the repo. Preview what will be sent with: ./gradlew printChangelog
def changelogFor(File file, String version) {
    if (!file.exists()) {
        return 'See the project page for the changelog.'
    }
    def wanted = ~('^##\\s+' + java.util.regex.Pattern.quote(version) + '\\s*$')
    def collected = []
    def inSection = false
    for (String line : file.readLines('UTF-8')) {
        if (line.startsWith('## ')) {
            if (inSection) {
                break // reached the next version — stop
            }
            inSection = wanted.matcher(line.trim()).matches()
            continue // never include the heading itself; the platform already shows the version
        }
        if (inSection) {
            collected << line
        }
    }
    def text = collected.join('\n').trim()
    return text ?: 'See the project page for the changelog.'
}

def changelogText = changelogFor(rootProject.file('CHANGELOG.md'), mod_version.toString())

tasks.register('printChangelog') {
    group = 'publishing'
    description = 'Prints the changelog section that would be published for the current version.'
    doLast {
        println "--- changelog to publish for ${mod_version} ---"
        println changelogText
        println '--- end ---'
    }
}

modrinth {
    token = providers.gradleProperty('MODRINTH_TOKEN').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
    projectId = modrinth_id
    versionNumber = mod_version
    versionName = mod_version
    versionType = 'release'
    uploadFile = tasks.named('jar')
    gameVersions = ['1.21.1']
    loaders = ['neoforge']
    changelog = changelogText
    // Modrinth project slugs (adjust if a publish fails on an unknown project):
    dependencies {
        required.project 'refined-storage'
        required.project 'cooking-for-blockheads'
        required.project 'balm'
        optional.project 'patchouli'
        optional.project 'jade'
        optional.project 'the-one-probe'
        optional.project 'jei'
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads the built jar to CurseForge.'
    apiToken = findProperty('CURSEFORGE_TOKEN') ?: System.getenv('CURSEFORGE_TOKEN')

    def mainFile = upload(curseforge_id, tasks.named('jar'))
    // displayName left unset on purpose -> CurseForge shows the jar's file name (refinedcooking-<version>.jar).
    mainFile.releaseType = 'release'
    mainFile.addGameVersion '1.21.1'
    mainFile.addModLoader 'NeoForge'
    mainFile.addEnvironment 'Client', 'Server'
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogText
    // CurseForge project slugs (adjust if a publish fails on an unknown project):
    mainFile.addRequirement 'refined-storage', 'cooking-for-blockheads', 'balm'
    mainFile.addOptional 'patchouli', 'jade', 'the-one-probe', 'jei'
}
