plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

apply from: rootProject.file('repositories.gradle')

configurations.configureEach {
    resolutionStrategy {
        // REI bundles a JEI-compat module that transitively pins JEI; MDG's consistent resolution would spread that
        // pin across the classpath and collide with our JEI. We run one viewer at a time and don't want REI's compat,
        // so JEI is excluded from REI (below) and our JEI version is forced here — a consumer force wins.
        force "mezz.jei:jei-26.1.2-neoforge:${jei_version}"
    }
}

neoForge {
    version = neo_version

    runs {
        // Single client run; which recipe viewer it loads is chosen with -Pviewer (see dependencies). JEI and REI
        // can't coexist, so we toggle the one run instead of adding a second.
        client {
            client()
        }
        server {
            server()
        }
        // 26.1's NeoForge split the single 'data' run type into clientData/serverData; data() no longer exists, which
        // fails IDE Gradle sync. We ship no datagen providers, so one clientData run keeps the run valid.
        data {
            clientData()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Which recipe viewer runClient loads. Chosen by the runClientRei task or -Pviewer=jei|rei; defaults to jei. (EMI has
// no 26.1 build, so it's not an option here.) Resolved at configuration time because it drives which viewer jar is
// added to the runtime classpath below.
def selectedViewer = {
    def requested = gradle.startParameter.taskNames
    if (requested.any { it.endsWith('runClientRei') }) return 'rei'
    return (findProperty('viewer') ?: 'jei').toString().toLowerCase()
}()

// runClientRei: the client run with REI instead of JEI. It just drives runClient — the viewer selection above keys
// off the task name. runClient on its own stays JEI.
tasks.register('runClientRei') {
    dependsOn 'runClient'
    group = 'mod development'
    description = 'Runs the game client with REI as the recipe viewer instead of JEI.'
}

dependencies {
    // Refined Storage 2, from RefinedMods' own CreeperHost maven. -neoforge is the mod itself; its POM declares
    // nothing but jsr305, so the modules we compile against (-common, -network -> the whole -api tree) are named here.
    implementation "com.refinedmods.refinedstorage:refinedstorage-neoforge:${rs_version}"
    implementation "com.refinedmods.refinedstorage:refinedstorage-common:${rs_version}"
    implementation "com.refinedmods.refinedstorage:refinedstorage-network:${rs_version}"

    implementation "net.blay09.mods:balm-neoforge:${balm_version}"
    // CFB publishes a clean 26.x build to the TwelveIterations maven, so no Modrinth-id pin (unlike the 1.21.1 line).
    implementation "net.blay09.mods:cookingforblockheads-neoforge:${cfb_version}"

    // Optional integrations — compiled against (the compat/ classes reference them) and loaded in the dev client so
    // they can be tested. The Jade @WailaPlugin class is only loaded by Jade's own scan when Jade is present.
    // The One Probe is DISABLED for 26.1.2 (no 26.1 build) — its addon in :neoforge compat/theoneprobe is stubbed.
    implementation "maven.modrinth:jade:${jade_version}"

    // Recipe viewers — JEI and REI (EMI has no 26.1 build). Each carries the same item info pages (compat/{jei,rei}).
    // Compile-only: each viewer finds its plugin by its own scan (@JeiPlugin / @REIPluginClient), so neither is bundled.
    // REI needs the full jar, not -api: BuiltinClientPlugin is in REI's default-plugin module. REI's strict JEI pin is
    // dropped by the exclude + the force above.
    compileOnly "mezz.jei:jei-26.1.2-neoforge:${jei_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { exclude group: 'mezz.jei' }

    // Exactly one viewer's full runtime jar is loaded, per selectedViewer above (runClient=JEI, runClientRei, or
    // -Pviewer=jei|rei). runtimeOnly, not clientAdditionalRuntimeClasspath: MDG's per-run additional classpath does not
    // reliably load its mods. JEI/REI are client-side and no-op on a server.
    switch (selectedViewer) {
        case 'rei':
            runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { exclude group: 'mezz.jei' }
            break
        default:
            runtimeOnly "mezz.jei:jei-26.1.2-neoforge:${jei_version}"
    }

    // Patchouli — optional, powers the in-game guide book. Resources only, needed only at runtime. From Modrinth
    // (pinned by version id — BlameJared has no 26.1 build).
    runtimeOnly "maven.modrinth:patchouli:${patchouli_version}"

    // Dev-only test mods — loaded in the dev client to make debugging easier. Not shipped.
    // ⚠️ ALL COMMENTED OUT for 26.1.2: the version ids are still 1.21.1 builds. Re-pin to a 26.1.2 build and un-comment
    // when a run needs one. None is shipped or on the compile classpath, so this does not affect compileJava.
    // runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-core:${harvestcraft_foodcore_version}"
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-crops:${harvestcraft_crops_version}"
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-trees:${harvestcraft_trees_version}"
    // runtimeOnly "maven.modrinth:pams-harvestcraft-2-food-extended:${harvestcraft_foodextended_version}"
    // runtimeOnly "maven.modrinth:mekanism:${mekanism_version}"
    // runtimeOnly "maven.modrinth:mekanism-generators:${mekanism_generators_version}"
    // runtimeOnly "maven.modrinth:mekanism-tools:${mekanism_tools_version}"
    // runtimeOnly "maven.modrinth:mekanism-additions:${mekanism_additions_version}"
    // clientAdditionalRuntimeClasspath "maven.modrinth:solar-flux-reborn:${solarflux_version}"
    // clientAdditionalRuntimeClasspath "maven.modrinth:hammer-lib:${hammerlib_version}"
}

// --- Publishing to Modrinth + CurseForge (NeoForge) -------------------------------------------
// Run manually: ./gradlew :neoforge:modrinth  /  :neoforge:publishCurseForge . Tokens from GRADLE_USER_HOME or env.
// Publishes a separate version per loader (…+neoforge-26.1.2), the same way the Fabric module does (…+fabric-26.1.2).
def changelogFor(File file, String version) {
    if (!file.exists()) {
        return 'See the project page for the changelog.'
    }
    def wanted = ~('^##\\s+' + java.util.regex.Pattern.quote(version) + '\\s*$')
    def collected = []
    def inSection = false
    for (String line : file.readLines('UTF-8')) {
        if (line.startsWith('## ')) {
            if (inSection) {
                break
            }
            inSection = wanted.matcher(line.trim()).matches()
            continue
        }
        if (inSection) {
            collected << line
        }
    }
    def text = collected.join('\n').trim()
    return text ?: 'See the project page for the changelog.'
}

def changelogText = changelogFor(rootProject.file('CHANGELOG.md'), mod_version.toString())

tasks.register('printChangelog') {
    group = 'publishing'
    description = 'Prints the changelog section that would be published for the current version.'
    doLast {
        println "--- changelog to publish for ${mod_version} ---"
        println changelogText
        println '--- end ---'
    }
}

modrinth {
    token = providers.gradleProperty('MODRINTH_TOKEN').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
    projectId = modrinth_id
    versionNumber = mod_version + "+neoforge-" + minecraft_version
    versionName = mod_version + " (NeoForge " + minecraft_version + ")"
    versionType = 'release'
    uploadFile = tasks.named('jar')
    gameVersions = ['26.1.2']
    loaders = ['neoforge']
    changelog = changelogText
    dependencies {
        required.project 'refined-storage'
        required.project 'cooking-for-blockheads'
        required.project 'balm'
        optional.project 'patchouli'
        optional.project 'jade'
        optional.project 'jei'
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads the built NeoForge jar to CurseForge.'
    apiToken = findProperty('CURSEFORGE_TOKEN') ?: System.getenv('CURSEFORGE_TOKEN')

    def mainFile = upload(curseforge_id, tasks.named('jar'))
    mainFile.releaseType = 'release'
    mainFile.addGameVersion '26.1.2'
    mainFile.addModLoader 'NeoForge'
    mainFile.addEnvironment 'Client', 'Server'
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogText
    mainFile.addRequirement 'refined-storage', 'cooking-for-blockheads', 'balm'
    mainFile.addOptional 'patchouli', 'jade', 'jei'
}
