// Shared repositories, applied by every module (common + each loader). Kept out of the convention plugin so loader
// modules can add loader-specific repos of their own if needed.
repositories {
    maven {
        name = 'CreeperHost (Refined Storage 2)'
        url = 'https://maven.creeperhost.net/release'
    }
    maven {
        name = 'TwelveIterations (Balm)'
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
    }
    maven {
        name = 'k-4u (The One Probe)'
        url = 'https://maven.k-4u.nl'
    }
    maven {
        name = 'Modrinth (Cooking for Blockheads, Jade, dev test mods)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared (Patchouli, JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'shedaniel (Roughly Enough Items)'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC (EMI, Mod Menu)'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'FTB (dev test mods)'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'Architectury (transitive dep of FTB Library)'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
