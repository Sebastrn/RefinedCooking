modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.refinedcooking]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.refinedcooking]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Refined Storage 2. Its modId is still "refinedstorage" and it declares a plain "2.0.9" — no prerelease
# qualifier — so the "[1.12,)" bound the 1.20.4 branch needed (to accept RS v1's final v1.13.0-beta.4, which
# sorted below its own release) retires with it.
[[dependencies.refinedcooking]]
modId = "refinedstorage"
type = "required"
versionRange = "[3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.refinedcooking]]
modId = "cookingforblockheads"
type = "required"
versionRange = "[26,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.refinedcooking]]
modId = "balm"
type = "required"
versionRange = "[26,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.refinedcooking]]
modId = "patchouli"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Soft integrations — discovered by each mod's own plugin system (Jade @WailaPlugin).
# Declared optional only for documentation + load order.
[[dependencies.refinedcooking]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

