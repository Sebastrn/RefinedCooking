# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Multi-loader build toggles — settings.gradle includes a loader module only when its flag is "true".
## Fabric stays off until the NeoForge regression guard is green (step 4 flips it on).
include_neoforge=true
include_fabric=true
include_forge=false

## Environment Properties
java_version=21
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
# 21.1.238, not AE2's 21.1.169 floor: The One Probe registers a mod-bus event on the game bus, which 21.1.169
# rejects outright and aborts the server (every TOP 1.21_neo build does this), and Mekanism 10.7.15.81+ requires
# [21.1.194,). See MIGRATION_NOTES §0.12. Applied Cooking 6.0.0 ships against this and is verified.
neo_version=21.1.238
neo_version_range=[21.1,)
# NeoForm (deobf vanilla Minecraft) for the loader-neutral common module — MDG's neoform mode compiles common
# against vanilla + Mojang mappings, no NeoForge API. Timestamp is 1.21.1-specific (same as CFB's 1.21.1 line).
neo_form_version=1.21.1-20240808.144430
# FML loader version range (javafml) — still [1,) at 1.21.1, same as AE2 and CFB declare.
loader_version_range=[1,)

## Fabric — verified against artifacts (Modrinth/meta.fabricmc.net, 2026-07-17).
fabric_loader_version=0.16.10
fabric_version=0.116.14+1.21.1
# CFB + Jade have per-loader files under the same version number, so the Fabric builds are pinned by Modrinth id:
# CFB 21.1.24+fabric-1.21.1, Jade 15.10.5+fabric.
cfb_fabric_version=tOG59W8V
jade_fabric_version=5Sbkzz4O
patchouli_fabric_version=1.21.1-93-FABRIC
# EMI's full Fabric jar isn't on the TerraformersMC maven (only the :api classifier is, used at compile time), so the
# dev-run runtime jar is pulled from Modrinth. 1.1.24+1.21.1+fabric = version on5GT1qh.
emi_fabric_modrinth=on5GT1qh
# Croptopia (CurseForge project 415438; Modrinth has no main Croptopia), Fabric 1.21.1 build 4.2.4 = file 7958878.
# Dev run only — its recipes let us test whether a fluid (water) held in the RS grid can feed the CFB cooking table.
croptopia_fabric_file=7958878
# EpheroLib (CurseForge 885449) — Croptopia's required Fabric library; 1.2.0 for 1.21.1 = file 6379763.
epherolib_fabric_file=6379763

## Publishing project ids (tokens go in GRADLE_USER_HOME/gradle.properties, NOT here)
curseforge_id=543972
modrinth_id=AOuwe9He

## Mod Properties
mod_id=refinedcooking
mod_name=Refined Cooking
mod_license=MIT
mod_version=6.4.0
mod_group_id=sebastrn
mod_authors=ItsSebastrn
mod_description=A mod to bridge Cooking For Blockheads with Refined Storage

## Dependency versions
# Refined Storage 2 — a ground-up rewrite; RS v1 has no 1.21 branch at all (it ends at 1.20.4). RS2 is on
# RefinedMods' own CreeperHost maven. refinedstorage-neoforge's POM declares only jsr305, so the api/impl modules
# are listed explicitly in the module build.gradle files rather than arriving transitively.
rs_version=2.0.9
balm_version=21.0.63+1.21.1
balm_version_range=[21,)
# CFB: Modrinth version id for 21.1.24 (neoforge 1.21.1). The TwelveIterations maven never published a +1.21.1
# build past 21.1.9, so the id is pinned. (Fabric CFB coordinate added with the fabric module in step 4.)
cfb_version=MQCIy6VF
top_version=1.21_neo-12.0.8-7
# Jade: Modrinth version id for the NeoForge 1.21.1 build (Jade 15.10.5, official-mapped).
# The version *number* collides with the Fabric (intermediary-mapped) file, so pin the id.
jade_version=yd8FKCmx
# JEI: NeoForge 1.21.1 build; compiled against for the compat/jei info pages (optional integration).
jei_version=19.39.0.368
# REI + EMI: the other two recipe viewers, each gets the same item info pages as JEI (compat/rei, compat/emi).
# Compiled against the -api artifacts only (the plugins are discovered by each viewer's own scan at runtime).
rei_version=16.0.799
emi_version=1.1.24+1.21.1
patchouli_version=1.21.1-93-NEOFORGE

