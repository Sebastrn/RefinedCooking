# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Multi-loader build toggles — settings.gradle includes a loader module only when its flag is "true".
## Fabric stays off until the NeoForge regression guard is green (the fabric module + loom plugin are added with it).
include_neoforge=true
include_fabric=true
include_forge=false

## Environment Properties
java_version=25
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
# 4-segment scheme now. Build against 26.1.2.74 — RS2 3.2.1's declared floor and the newest 26.1.2 build that
# actually resolves (.79-.82 are in the metadata but their POMs 404). See MIGRATION_NOTES §0.14/§0.14.1.
neo_version=26.1.2.74
neo_version_range=[26.1,)
# NeoForm (deobf vanilla Minecraft) for the loader-neutral common module — MDG's neoform mode compiles common
# against vanilla + Mojang mappings, no NeoForge API. 26.1.2-1 is what CFB's 26.1 line builds common against.
neo_form_version=26.1.2-1
# FML loader version range (javafml) — still [1,) at 26.1.2, same as AE2 and CFB declare.
loader_version_range=[1,)

## Fabric — verified against artifacts (2026-07-18). fabric-api is bumped above CFB's catalog (0.145.4): CFB's dev env
## is standalone, but ours also loads Jade/JEI/Patchouli, whose transitives pull a newer fabric-api, and one of them
## references net.fabricmc.fabric.api.event.lifecycle.v1.EntityLoadData (absent from 0.146.x's fabric-lifecycle-events).
## 0.155.2 is the latest 26.1.2 build and supplies it; loader 0.19.2 is what the ecosystem resolves.
fabric_loader_version=0.19.2
fabric_version=0.155.2+26.1.2
# CFB + Jade + Patchouli have per-loader files under the same version number; the Fabric builds that collide are
# pinned by Modrinth id. CFB/Balm/RS/JEI/REI publish clean per-loader coordinates that share ONE version across
# loaders, so those need no separate fabric key (see the dependency section below).
# Jade 26.1.8+fabric (neoforge id jade_version=gWlwZzoj is 26.1.8+neoforge — same version).
jade_fabric_version=Bw2a8uFN
# Patchouli 26.1-94-beta fabric (neoforge id patchouli_version=2CsnFLom is the same version).
patchouli_fabric_version=AveV4Tjn

## Publishing project ids (tokens go in GRADLE_USER_HOME/gradle.properties, NOT here)
curseforge_id=543972
modrinth_id=AOuwe9He

## Mod Properties
mod_id=refinedcooking
mod_name=Refined Cooking
mod_license=MIT
mod_version=7.3.0
mod_group_id=sebastrn
mod_authors=ItsSebastrn
mod_description=A mod to bridge Cooking For Blockheads with Refined Storage

## Dependency versions (shared across loaders unless noted)
# Refined Storage 2 — on RefinedMods' CreeperHost maven. refinedstorage-neoforge/-fabric's POMs declare only jsr305,
# so the api/impl modules (-common, -network) are listed explicitly in the module build.gradle files.
rs_version=3.2.1
# Balm AND CFB publish clean 26.x per-loader coordinates to the TwelveIterations maven
# (net.blay09.mods:*-{common,neoforge,fabric}), so both loaders use the SAME version — no Modrinth-id pin.
balm_version=26.1.2.9
balm_version_range=[26,)
cfb_version=26.1.2.3
# The One Probe has NO 26.1 build (k-4u maven ends at 1.21_neo). The TOP integration is DISABLED for 26.1.2
# (see neoforge TheOneProbeAddon.java + neoforge/build.gradle). Re-add when TOP ships for 26.1.
# top_version=
# Jade: Modrinth version id for the NeoForge 26.1.2 build (26.1.8+neoforge). Fabric build pinned above (jade_fabric_version).
jade_version=gWlwZzoj
# JEI: artifact jei-26.1.2-{neoforge,fabric,common-api} (exact MC patch). Same version both loaders.
jei_version=29.16.0.47
# REI: the other recipe viewer available on 26.1 (EMI has no 26.1 build). Same item info pages as JEI (compat/rei).
# Compiled against the full jar — the info-page entry point (BuiltinClientPlugin) isn't in REI's -api artifact. Same version both loaders.
rei_version=26.1.819
# Patchouli: Modrinth version id for the 26.1 NeoForge build (26.1-94-beta). Fabric build pinned above (patchouli_fabric_version).
patchouli_version=2CsnFLom

