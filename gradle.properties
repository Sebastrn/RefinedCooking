# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
# 4-segment scheme now. Build against 26.1.2.74 — RS2 3.2.1's declared floor and the newest 26.1.2 build that
# actually resolves (.79-.82 are in the metadata but their POMs 404). See MIGRATION_NOTES §0.14/§0.14.1.
neo_version=26.1.2.74
neo_version_range=[26.1,)
# FML loader version range (javafml) — still [1,) at 1.21.1, same as AE2 and CFB declare.
loader_version_range=[1,)

## Publishing project ids (tokens go in GRADLE_USER_HOME/gradle.properties, NOT here)
curseforge_id=543972
modrinth_id=AOuwe9He

## Mod Properties
mod_id=refinedcooking
mod_name=Refined Cooking
mod_license=MIT
mod_version=6.0.0
mod_group_id=sebastrn
mod_authors=ItsSebastrn
mod_description=A mod to bridge Cooking For Blockheads with Refined Storage

## Dependency versions (NeoForge 26.1.2 builds)
# Refined Storage 2 — version bump 2.0.9 -> 3.2.1 (a bump WITHIN RS2, not another rewrite; the §0.13.* design carries).
# On RefinedMods' CreeperHost maven. refinedstorage-neoforge's POM declares only jsr305, so the api/impl modules are
# listed explicitly in build.gradle rather than arriving transitively.
rs_version=3.2.1
# Balm AND CFB now publish clean 26.x versions to the TwelveIterations maven (net.blay09.mods:*-neoforge), so CFB
# no longer needs the 1.21.1 Modrinth-id pin.
balm_version=26.1.2.9
cfb_version=26.1.2.3
# The One Probe has NO 26.1 build (k-4u maven ends at 1.21_neo). The TOP integration is COMMENTED OUT for 26.1.2
# (see TheOneProbeAddon.java + build.gradle). Re-add when TOP ships for 26.1.
# top_version=
# Jade: Modrinth version id for the NeoForge 26.1.2 build (26.1.8+neoforge). Version number collides with Fabric.
jade_version=gWlwZzoj
# JEI: artifact jei-26.1.2-neoforge (exact MC patch — jei-26.1-neoforge declares minecraft [26.1,26.1] and is rejected
# on 26.1.2; AE2 side aside, keep it aligned with AC). Latest 26.1.2 build.
jei_version=29.16.0.47
# Patchouli: Modrinth version id for the 26.1 NeoForge build (26.1-94-beta). BlameJared has no 26.1 build.
patchouli_version=2CsnFLom

